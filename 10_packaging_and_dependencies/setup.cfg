[metadata]
name = mlops-pipeline
version = 1.2.3
description = MLOps pipeline package for model training and deployment
author = MLOps Team
author_email = mlops@company.com
license = MIT
long_description = file: README.md
long_description_content_type = text/markdown

[options]
packages = find:
package_dir =
    = src
python_requires = >=3.8
install_requires =
    pandas>=1.5,<2.0
    numpy>=1.20.0
    scikit-learn>=1.0.0,<2.0.0
    mlflow>=2.0.0
    boto3>=1.26.0
    pydantic>=1.10.0,<3.0.0

[options.packages.find]
where = src

[options.extras_require]
dev = 
    pytest>=7.0.0
    black>=22.0.0
    flake8>=5.0.0
    mypy>=1.0.0
api = 
    fastapi>=0.95.0
    uvicorn>=0.20.0

[options.entry_points]
console_scripts =
    train-model = mlops_pipeline.cli:train
    deploy-model = mlops_pipeline.cli:deploy